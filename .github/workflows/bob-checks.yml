name: Bob project mentor checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax, manifest, reasoning and extension regression tests
        run: npm test
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser integration and layout tests
        run: npm run test:browser
      - name: Actual MV3 extension loading and refresh
        run: npm run test:extension
