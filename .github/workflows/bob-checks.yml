name: Bob project mentor checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: bob-checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax, manifest, reasoning and extension regression tests
        run: npm test
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser integration and layout tests
        run: npm run test:browser
      - name: Actual MV3 extension loading and refresh
        run: npm run test:extension
      - name: Build reproducible extension ZIP
        run: python3 scripts/package.py
      - name: Upload verified extension package
        uses: actions/upload-artifact@v4
        with:
          name: bob-extension
          path: bob-extension.zip
          if-no-files-found: error
      - name: Update package in repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bob-extension.zip
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh verified Bob extension ZIP [skip ci]"
            git push origin HEAD:main
          fi
